name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest pytest-asyncio httpx
      - name: Lint
        run: |
          pip install ruff
          ruff check backend/
      - name: Run tests
        working-directory: backend
        env:
          OPENAI_API_KEY: "sk-test"
          REDIS_URL: "redis://localhost:6379"
        run: pytest tests/ -v --tb=short || true

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker Build
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        run: docker build -f docker/Dockerfile.backend -t genai-chat-backend:${{ github.sha }} ./backend
      - name: Build frontend
        run: docker build -f docker/Dockerfile.frontend -t genai-chat-frontend:${{ github.sha }} ./frontend
