apiVersion: v1
kind: Namespace
metadata:
  name: genai-chat
---
# Secret for API keys
apiVersion: v1
kind: Secret
metadata:
  name: genai-secrets
  namespace: genai-chat
type: Opaque
stringData:
  openai-api-key: "YOUR_OPENAI_API_KEY_HERE"
---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: genai-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: genai-chat
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
# Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-backend
  namespace: genai-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genai-backend
  template:
    metadata:
      labels:
        app: genai-backend
    spec:
      containers:
        - name: backend
          image: genai-chat-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: genai-secrets
                  key: openai-api-key
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: CORS_ORIGINS
              value: '["http://localhost:3000"]'
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: vector-data
              mountPath: /app/data
      volumes:
        - name: vector-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: genai-backend
  namespace: genai-chat
spec:
  selector:
    app: genai-backend
  ports:
    - port: 8000
---
# HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: genai-chat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: genai-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
